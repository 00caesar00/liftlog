<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LiftLog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#0e1116; --card:#171c24; --card2:#1f2630; --line:#2a323d;
  --fg:#e8edf3; --muted:#8b97a6; --accent:#4ade80; --accent2:#22d3ee; --warn:#fbbf24; --bad:#f87171; --grid:#252c36;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:contain}
body{padding:0 0 92px 0}
header{position:sticky; top:0; z-index:20; background:rgba(14,17,22,.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex; align-items:center; gap:10px}
header h1{font-size:17px; margin:0; letter-spacing:.5px; font-weight:650}
header .sp{flex:1}
#syncdot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);
  display:grid;place-items:center;font-size:13px;color:var(--muted)}
#syncdot::after{content:"●"}
#syncdot[data-state=ok]{color:var(--accent)}
#syncdot[data-state=dirty]{color:var(--warn)}
#syncdot[data-state=syncing]{color:var(--accent2)}
#syncdot[data-state=error]{color:var(--bad)}
#main{padding:14px 12px; max-width:640px; margin:0 auto}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px}
.card.row{display:flex; gap:8px; align-items:center}
.card.row input{flex:1; margin:0}
h2{margin:2px 0 8px; font-size:22px; font-weight:680}
.kicker{font-size:11px; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{margin-left:auto; text-align:right}
.note{background:var(--card2); border-left:3px solid var(--accent2); padding:8px 10px; border-radius:8px; font-size:14px; margin:8px 0}
.lastline{font-size:12.5px; color:var(--muted); background:var(--card2); padding:6px 9px; border-radius:8px; margin:6px 0}
.big-num{font-size:34px; font-weight:700}
button{appearance:none; border:1px solid var(--line); background:var(--card2); color:var(--fg);
  padding:11px 14px; border-radius:12px; font-size:15px; font-weight:600; margin:6px 6px 0 0}
button.primary{background:var(--accent); color:#0b1a10; border-color:transparent}
button.big{display:block; width:100%; padding:15px; font-size:17px; margin-top:12px}
button.ghost{background:transparent; color:var(--muted)}
button.tiny{padding:5px 9px; font-size:13px; margin:0}
button:active{transform:scale(.98)}
input,select,textarea{width:100%; background:var(--card2); border:1px solid var(--line); color:var(--fg);
  border-radius:12px; padding:11px 12px; font-size:16px; margin:6px 0; font-family:inherit}
textarea{resize:vertical}
.field{margin-bottom:6px}
.field label{font-size:12.5px; color:var(--muted)}
.exlist{margin-top:6px}
.exrow{display:flex; gap:10px; align-items:baseline; padding:7px 0; border-top:1px solid var(--line)}
.exrow:first-child{border-top:none}
.exhead{display:flex; align-items:flex-start; gap:10px}
.exhead>div:first-child{flex:1}
.exname{font-weight:640}
.setrow{display:flex; align-items:center; gap:10px; padding:9px 10px; margin-top:6px;
  background:var(--card2); border-radius:10px}
.setno{width:22px; height:22px; border-radius:50%; background:var(--accent); color:#0b1a10;
  display:grid; place-items:center; font-size:12px; font-weight:700; flex:none}
.setval{font-variant-numeric:tabular-nums; font-weight:600; flex:1}
.entry{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px}
.warmbtn{margin:2px 0 0; padding:11px 6px; font-size:14px; color:var(--muted)}
.warmbtn.on{background:var(--warn); color:#2a1d00; border-color:transparent}
.stepper{background:var(--card2); border-radius:12px; padding:6px 3px; min-width:0}
.slabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); text-align:center}
.srow{display:flex; align-items:center; gap:2px}
.sbtn{flex:none; width:28px; padding:8px 0; margin:0; font-size:19px; line-height:1; background:transparent; border:none; color:var(--accent2)}
.sval{flex:1; min-width:0; width:100%; text-align:center; font-size:18px; letter-spacing:-.3px; font-weight:700; font-variant-numeric:tabular-nums; padding:6px 0; margin:0; background:transparent; border:none; border-radius:8px}
.sval:focus{outline:1px solid var(--accent2); background:var(--card)}
.logbtn{grid-column:2/-1; width:100%; margin:2px 0 0}
.bar{display:flex; align-items:center; gap:9px; margin:7px 0}
.blabel{width:62px; font-size:13px; color:var(--muted)}
.btrack{flex:1; height:9px; background:var(--card2); border-radius:6px; overflow:hidden}
.bfill{height:100%; background:var(--accent); border-radius:6px}
.bfill.low{background:var(--warn)} .bfill.high{background:var(--bad)}
.bval{width:34px; text-align:right; font-size:13px; font-variant-numeric:tabular-nums}
nav{position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex;
  background:rgba(14,17,22,.95); backdrop-filter:blur(12px); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1; background:none; border:none; margin:0; border-radius:0; padding:13px 4px 14px;
  color:var(--muted); font-size:12px; font-weight:600}
.tab.on{color:var(--accent)}
#rest{position:fixed; left:12px; right:12px; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:30;
  background:var(--accent2); color:#04212a; border-radius:14px; padding:11px 14px;
  display:none; align-items:center; gap:10px; font-weight:700}
#rest.show{display:flex}
#rest .sp{flex:1}
#rest button{background:rgba(0,0,0,.15); border:none; color:#04212a; padding:7px 11px; margin:0; font-size:14px}
#restTime{font-variant-numeric:tabular-nums; font-size:20px}
#toast{position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(78px + env(safe-area-inset-bottom));
  background:#e8edf3; color:#0e1116; padding:11px 16px; border-radius:12px; font-size:14px; font-weight:600;
  opacity:0; pointer-events:none; transition:.25s; z-index:40; max-width:90vw; text-align:center}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

.tiny-note{font-size:12px}
.card.done{opacity:.72}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--card2)}
.chip{font-size:12px; font-weight:650; padding:3px 8px; border-radius:999px; background:var(--card2); color:var(--muted); white-space:nowrap; flex:none}
.chip.ok{color:var(--accent)} .chip.down{color:var(--bad)} .chip.warn{color:var(--warn)}
.exhead .chip{margin-top:2px}
.setrow{cursor:pointer}
.setrow.warm{opacity:.6}
.setrow.warm .setno{background:var(--muted)}
.btnrow{display:flex; flex-wrap:wrap; gap:0}
.brief{white-space:pre-wrap; font-size:14px; background:var(--card2); border-radius:10px; padding:9px 11px; margin:8px 0; color:var(--fg)}
.clamp{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
details{margin-top:10px} summary{cursor:pointer; padding:4px 0}
.toggle{display:flex; align-items:center; gap:10px; margin:12px 0 4px; font-size:14px}
.toggle input{width:22px; height:22px; margin:0; flex:none; accent-color:var(--accent)}
button.back{margin:0 0 8px; padding:6px 4px}
.group{font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin:14px 0 2px; font-weight:600}
.group:first-of-type{margin-top:4px}
.liftrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); cursor:pointer}
.liftrow .lname{flex:1; min-width:0}
.liftrow .lname .exname{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.spark{flex:none}
.lval{text-align:right; flex:none; width:92px}
.lval .num{font-weight:700; font-size:16px}
.lval .chip{display:inline-block; margin-top:2px}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0}
.tile{background:var(--card2); border-radius:12px; padding:10px 11px}
.tlabel{font-size:12px; color:var(--muted)}
.tval{font-size:20px; font-weight:700; margin-top:2px}
.kicker.spaced{margin-top:14px}
.chart{position:relative; margin:6px 0 2px; touch-action:pan-y}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.chart .axis{font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums}
.chart .vlabel{font-size:12px; font-weight:700; fill:var(--fg)}
.tip{display:none; position:absolute; top:-4px; width:170px; background:var(--fg); color:var(--bg); border-radius:9px; padding:6px 9px; font-size:12.5px; pointer-events:none}
.tip strong{font-size:14px}
.sheet-back{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; opacity:0; transition:opacity .15s}
.sheet-back.show{opacity:1}
.sheet{width:100%; max-width:640px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-bottom:none;
  border-radius:18px 18px 0 0; padding:16px 14px calc(16px + env(safe-area-inset-bottom)); max-height:85vh; overflow:auto}
.sheet h3{margin:0 0 4px; font-size:19px}
.sheet button.big{margin-top:8px}
.picklist{max-height:45vh; overflow:auto; margin:4px 0}
button.pick{display:block; width:100%; text-align:left; margin:4px 0; font-weight:500}
</style>
</head>
<body>
<header>
  <h1>LIFTLOG</h1>
  <div class="sp"></div>
  <button id="syncdot" data-state="ok" title="Sync"></button>
</header>

<div id="main"></div>

<div id="rest">
  <span>Rest</span><span id="restTime">0:00</span><span class="sp"></span>
  <button id="restPlus">+30s</button><button id="restStop">Skip</button>
</div>

<nav>
  <button class="tab on" data-route="today">Today</button>
  <button class="tab" data-route="history">History</button>
  <button class="tab" data-route="stats">Stats</button>
  <button class="tab" data-route="settings">Settings</button>
</nav>

<div id="toast"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
